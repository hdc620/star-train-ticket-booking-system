server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/star_train_ticket_booking_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}   # 从环境变量读取，本地运行时可通过IDEA配置填入
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.star.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

com:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:}    # 留空，从环境变量读取
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: authentication


     
