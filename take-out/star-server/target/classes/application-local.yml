server:
   port: 8080

spring:
   datasource:
      url: jdbc:mysql://localhost:3306/star_train_ticket_booking_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: root
      password: __REDACTED__
      driver-class-name: com.mysql.cj.jdbc.Driver
   data:
     redis:
       host: localhost      # Redis服务器地址
       port: 6380           # 端口
       #password: __REDACTED__           # 密码，生产环境请务必设置
       database: 0          # 使用的数据库索引
       lettuce:
         pool:
           max-active: 8    # 连接池最大连接数
           max-idle: 8      # 最大空闲连接
           min-idle: 0      # 最小空闲连接
       timeout: 5000ms      # 连接超时时间

mybatis-plus:
   mapper-locations: classpath:mapper/**/*.xml
   type-aliases-package: com.star.entity
   configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

com:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: __REDACTED_JWT_ADMIN__
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: __REDACTED_JWT_USER__
    user-ttl: 7200000
    user-token-name: authentication


     